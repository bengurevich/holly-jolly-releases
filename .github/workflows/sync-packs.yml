# Copies every new pack release from sebscrim/holly-jolly-craft (private) here, where the Holly Jolly launcher looks,
# every 15 minutes, so new packs arrive without anyone copying them (Ben: "i want the launcher to do it
# automatically"). Launchers and the server updater then take a pack at the next 6:00 AM New York time (or straight
# away after "Release now"). Seb's own release workflow copies packs here too, once it has that step; whichever runs
# first copies it and the other sees it is already here.
#
# SOURCE_TOKEN: a GitHub token that can read sebscrim/holly-jolly-craft's releases (a classic token with the "repo"
# scope, from an account that is a collaborator there). Without it this is skipped with a warning.
name: Sync packs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-packs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOURCE: sebscrim/holly-jolly-craft
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Copy new packs
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_TOKEN" ]; then echo "::warning::no SOURCE_TOKEN secret: can't read $SOURCE"; exit 0; fi
          HERE=${{ github.repository }}
          if ! GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE" -q .full_name > /dev/null; then
            echo "::error::SOURCE_TOKEN can't read $SOURCE: it needs to be a classic token with the 'repo' scope, from an account that is a collaborator there"
            exit 1
          fi
          # Packs are ordered by their tag (pack-<date>, then -2, -3 ...), never by when they were published: a pack
          # copied here again is published later and outranked a newer one (2026-11-25).
          KEY='def key: capture("^pack-(?<d>[0-9]{4}-[0-9]{2}-[0-9]{2})(-(?<n>[0-9]+))?$") | [.d, ((.n // "1") | tonumber)];
               def packs: map(.tagName | select(test("^pack-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$")));'
          here=$(gh release list -R "$HERE" --limit 200 --json tagName)
          newest=$(jq -c "$KEY"' packs | map(key) | max // []' <<< "$here")      # ([] = none yet: before every pack)
          echo "newest pack here: $newest"
          # Seb's newest packs (up to 3, oldest first) that are newer than every pack here. Only newer: a pack deleted
          # here (the 10-pack limit below, or by hand) is never brought back.
          source=$(GH_TOKEN="$SOURCE_TOKEN" gh release list -R "$SOURCE" --limit 10 --json tagName,isDraft)
          for tag in $(jq -r --argjson newest "$newest" "$KEY"' map(select(.isDraft | not)) | packs
                         | map(select(key > $newest)) | sort_by(key) | .[-3:] | .[]' <<< "$source"); do
            echo "copying $tag"
            dir=$(mktemp -d)
            GH_TOKEN="$SOURCE_TOKEN" gh release download "$tag" -R "$SOURCE" -D "$dir" -p "holly-jolly-craft-*-$tag.zip"
            GH_TOKEN="$SOURCE_TOKEN" gh release view "$tag" -R "$SOURCE" --json body -q .body > "$dir/notes.md"
            title=$(GH_TOKEN="$SOURCE_TOKEN" gh release view "$tag" -R "$SOURCE" --json name -q .name)
            gh release create "$tag" -R "$HERE" --title "$title" --notes-file "$dir/notes.md" "$dir"/holly-jolly-craft-*.zip
            rm -rf "$dir"
            echo "- copied $tag" >> "$GITHUB_STEP_SUMMARY"
          done
          # the 10 newest packs kept here (by tag)
          gh release list -R "$HERE" --limit 200 --json tagName |
            jq -r "$KEY"' packs | sort_by(key) | reverse | .[10:] | .[]' |
            xargs -r -n1 gh release delete -R "$HERE" --yes
